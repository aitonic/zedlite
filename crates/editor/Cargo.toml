[package]
name = "editor"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/editor.rs"
doctest = false

[features]
default = ["coding"]
coding = []
test-support = [
    "coding",
    "text/test-support",
    "gpui/test-support",
    "multi_buffer/test-support",
    "project/test-support",
    "theme/test-support",
    "util/test-support",
    "workspace/test-support",
    "unindent",
]

[dependencies]
