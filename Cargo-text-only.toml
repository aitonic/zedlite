[workspace]
resolver = "2"

# TEXT-ONLY BUILD: Novel Writing Tool
# This is a simplified version with coding features removed
# To use: mv Cargo.toml Cargo-full.toml && mv Cargo-text-only.toml Cargo.toml

members = [
    # Core infrastructure
    "crates/assets",
    "crates/editor", 
    "crates/text",
    "crates/ui",
    "crates/gpui",
    "crates/gpui_macros",
    "crates/gpui_tokio",
    "crates/settings",
    "crates/util",
    "crates/util_macros",
    "crates/workspace",
    "crates/panel",
    "crates/menu",
    "crates/picker",
    
    # Text and document handling
    "crates/markdown",
    "crates/markdown_preview",
    "crates/multi_buffer",
    "crates/rich_text",
    "crates/rope",
    "crates/buffer_diff",
    
    # Novel writing specific
    "crates/manuscript_panel",
    
    # Agent and AI functionality (essential for novel writing)
    "crates/agent",
    "crates/agent2",
    "crates/agent_servers",
    "crates/agent_settings",
    "crates/agent_ui",
    "crates/assistant_context",
    "crates/assistant_slash_command",
    "crates/assistant_slash_commands",
    "crates/assistant_tool",
    "crates/assistant_tools",
    "crates/context_server",
    "crates/prompt_store",
    
    # AI providers
    "crates/anthropic",
    "crates/open_ai",
    "crates/open_router",
    "crates/google_ai",
    "crates/ollama",
    "crates/bedrock",
    "crates/deepseek",
    "crates/mistral",
    "crates/vercel",
    "crates/x_ai",
    "crates/lmstudio",
    
    # Core utilities
    "crates/collections",
    "crates/fs",
    "crates/http_client",
    "crates/http_client_tls",
    "crates/paths",
    "crates/clock",
    "crates/sum_tree",
    "crates/sqlez",
    "crates/sqlez_macros",
    "crates/db",
    "crates/semantic_version",
    "crates/refineable",
    "crates/refineable/derive_refineable",
    
    # UI components (essential)
    "crates/theme",
    "crates/theme_selector",
    "crates/ui_macros",
    "crates/ui_input", 
    "crates/ui_prompt",
    "crates/icons",
    "crates/file_icons",
    "crates/activity_indicator",
    "crates/title_bar",
    "crates/welcome",
    "crates/onboarding",
    
    # File handling (essential for manuscript management)
    "crates/file_finder",
    "crates/fuzzy",
    "crates/streaming_diff",
    
    # Networking and clients (needed for AI)
    "crates/client",
    "crates/rpc",
    "crates/proto",
    "crates/net",
    "crates/reqwest_client",
    "crates/aws_http_client",
    "crates/cloud_api_client",
    "crates/cloud_api_types",
    "crates/cloud_llm_client",
    
    # Core app
    "crates/zedlite_app",
    "crates/zed_actions",
    
    # Essential support
    "crates/task", 
    "crates/story",
    "crates/storybook",
    "crates/component",
    "crates/time_format",
    "crates/feature_flags",
    "crates/session",
    "crates/crashes",
    "crates/watch",
    
    # Tooling
    "tooling/workspace-hack",
    "tooling/xtask",
]

# REMOVED CRATES (Coding/IDE features):
# - language/* (LSP, syntax highlighting, language support)
# - git/* and jj/* (version control)
# - dap/* and debugger* (debugging tools)
# - extension* (extension system)
# - terminal* (terminal functionality)
# - project/project_panel (project management for code)
# - search (code search)
# - outline/outline_panel (code outline)
# - prettier (code formatting)
# - vim/* (vim mode)
# - snippet* (code snippets)
# - copilot/supermaven (code completion)
# - diagnostics (code diagnostics)
# - node_runtime (JavaScript/Node.js support)
# - worktree (workspace tree management)
# - recent_projects (recent projects panel)
# - command_palette* (coding-focused commands)

default-members = ["crates/zedlite_app"]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]

# Novel writing
manuscript_panel = { path = "crates/manuscript_panel" }

